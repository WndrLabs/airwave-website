name: Deploy site

# Rebuilt on every push, every day (the station list changes weekly), and by hand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node build.mjs
        env:
          # Repository variables (Settings › Secrets and variables › Actions › Variables).
          # Without SITE_URL, https://skywave-radio.app (build.mjs).
          SITE_URL: ${{ vars.SITE_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
